<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LALAPO 🌿 | Profil</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: 'Quicksand', sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(circle at 10% 10%, #A8B58A66, transparent 25%),
                radial-gradient(circle at 90% 80%, #D6C58B55, transparent 25%),
                #F5F1E3;

            color: #303A24;

        }

        nav {

            background: #303A24;

            padding: 18px 8%;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .logo {

            font-family: 'Fredoka';

            font-size: 28px;

            font-weight: 700;

            color: white;

            text-decoration: none;

        }

        .logo span {

            color: #D6C58B;

        }

        nav ul {

            display: flex;

            gap: 25px;

            list-style: none;

        }

        nav a {

            color: white;

            text-decoration: none;

            font-weight: 600;

        }

        nav a:hover {

            color: #D6C58B;

        }

        .container {

            width: 90%;

            max-width: 600px;

            margin: 70px auto;

        }

        .form-card {

            background: rgba(255,255,255,.9);

            padding: 40px;

            border-radius: 40px;

            border: 3px solid #A8B58A;

            box-shadow: 0 20px 45px #303A2415;

        }

        h1 {

            text-align: center;

            font-family: 'Fredoka';

            font-size: 45px;

            color: #4F5D3A;

            margin-bottom: 10px;

        }

        .subtitle {

            text-align: center;

            margin-bottom: 35px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

            color: #4F5D3A;

        }

        input,
        textarea {

            width: 100%;

            padding: 14px 17px;

            margin-bottom: 22px;

            border-radius: 18px;

            border: 2px solid #A8B58A;

            outline: none;

            font-family: 'Quicksand';

            font-size: 15px;

            background: #F5F1E3;

            color: #303A24;

            transition: .3s;

        }

        input:focus,
        textarea:focus {

            border-color: #4F5D3A;

            box-shadow: 0 0 0 4px #A8B58A55;

        }

        textarea {

            resize: vertical;

            min-height: 100px;

        }

        button {

            width: 100%;

            border: none;

            padding: 16px;

            border-radius: 25px;

            background: #4F5D3A;

            color: white;

            font-family: 'Fredoka';

            font-size: 18px;

            cursor: pointer;

            transition: .3s;

        }

        button:hover {

            background: #303A24;

            transform: translateY(-4px);

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #4F5D3A;

            text-decoration: none;

            font-weight: 700;

        }

        footer {

            margin-top: 70px;

            padding: 30px;

            text-align: center;

            background: #303A24;

            color: white;

        }

        @media(max-width:650px) {

            nav {

                flex-direction: column;

                gap: 15px;

            }

            nav ul {

                flex-wrap: wrap;

                justify-content: center;

            }

            .form-card {

                padding: 25px;

            }

        }

    </style>

</head>

<body>

    <nav>

        <a href="index.html" class="logo">
            LALA<span>PO</span> 🌿
        </a>

        <ul>

            <li>
                <a href="index.html">Beranda</a>
            </li>

            <li>
                <a href="detail.html">Tentang</a>
            </li>

            <li>
                <a href="detail2.html">Hobi</a>
            </li>

            <li>
                <a href="profil.html">Profil</a>
            </li>

        </ul>

    </nav>


    <div class="container">

        <div class="form-card">

            <h1>My Profile 🌿</h1>

            <p class="subtitle">
                Isi data dirimu di sini ✨
            </p>


            <form id="profileForm">

                <label for="nim">
                    NIM
                </label>

                <input
                    type="text"
                    id="nim"
                    placeholder="Masukkan NIM"
                    required
                >


                <label for="nama">
                    Nama
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama"
                    required
                >


                <label for="alamat">
                    Alamat
                </label>

                <textarea
                    id="alamat"
                    placeholder="Masukkan alamat"
                    required
                ></textarea>


                <label for="hobi">
                    Hobi
                </label>

                <input
                    type="text"
                    id="hobi"
                    placeholder="Contoh: Memasak, makan, fotografi"
                    required
                >


                <label for="instagram">
                    Instagram
                </label>

                <input
                    type="text"
                    id="instagram"
                    placeholder="@username"
                    required
                >


                <button type="submit">
                    Simpan Profil 🌱
                </button>

            </form>


            <a href="index.html" class="back">
                ← Kembali ke Beranda
            </a>

        </div>

    </div>


    <footer>

        <p>
            LALAPO 🌿 — My Little Green World
        </p>

    </footer>


    <script>

        document
        .getElementById("profileForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const data = {

                nim:
                document.getElementById("nim").value,

                nama:
                document.getElementById("nama").value,

                alamat:
                document.getElementById("alamat").value,

                hobi:
                document.getElementById("hobi").value,

                instagram:
                document.getElementById("instagram").value

            };

            localStorage.setItem(
                "dataProfil",
                JSON.stringify(data)
            );

            window.location.href =
                "profil-tampil.html";

        });

    </script>

</body>

</html>
